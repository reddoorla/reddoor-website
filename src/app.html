<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />

    <!--
      Fonts load async so they don't block first paint (LCP). The media="print"
      → onload="this.media='all'" trick fetches the stylesheet without render-
      blocking, then applies it once loaded; <noscript> covers JS-disabled.
      Besley is requested upright-only (no italics are used) to trim the payload.
    -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://use.typekit.net/noj4tji.css" />
    <link
      rel="stylesheet"
      href="https://use.typekit.net/noj4tji.css"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Besley:wght@400..900&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://use.typekit.net/noj4tji.css" />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Besley:wght@400..900&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width" />
    %sveltekit.head%

    <!--
      Google tag (gtag.js) — privacy-hardened (MED-7). gtag.js is NOT loaded on
      landing; it's deferred until the first real interaction (scroll / pointer /
      key / touch), so no analytics cookies are set for a visitor who never
      engages. When it does load we enable IP anonymisation and SameSite=Lax;
      Secure cookie flags. Trade-off: a zero-interaction bounce isn't counted.
    -->
    <script>
      (function () {
        var GA_ID = "G-2CZMPGL9RR";
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;

        // Paths whose URL *is* a credential. gtag reads location.href for
        // page_location, so loading it here would put the secret into GA4
        // property data — readable by anyone with access, exportable to
        // BigQuery, retained on Google's schedule.
        //
        // This is the same hazard $lib/url/stripQueryParams.ts is written
        // against ("anything that later reads location.href — gtag.js above
        // all"), but a path segment is strictly worse than a query param:
        // stripping cannot help, because you cannot strip the URL the page IS.
        //
        // A prefix list, not an exact match — /audit/{token} and
        // /audit/{token}/print both qualify.
        var CREDENTIAL_PATHS = ["/audit/"];
        function urlIsSecret() {
          return CREDENTIAL_PATHS.some(function (p) {
            return location.pathname.indexOf(p) === 0;
          });
        }

        // Production only. This same app.html ships to `vite dev` on a laptop,
        // to every Netlify deploy preview and to staging, so without a host
        // check the property counts our own runs as visitors. That is not a
        // rounding error: for the 30 days to 2026-09-14 GA4 recorded 16,072
        // users on this property and 15,971 of them were `localhost` — the
        // Playwright smoke suite, which clicks and scrolls and so trips the
        // interaction gate below. Real traffic over the same window was 87,
        // and the maintenance report mailed the noise as a 510% rise.
        //
        // Exact hostnames, never a suffix match: `staging.reddoorla.com` ends
        // with the production domain and must NOT be measured. This file
        // cannot import $lib/site.ts, so a unit test keeps the two in step.
        var MEASURED_HOSTS = ["reddoorla.com", "www.reddoorla.com"];
        function hostIsMeasured() {
          return MEASURED_HOSTS.indexOf(location.hostname) !== -1;
        }

        var events = ["pointerdown", "keydown", "scroll", "touchstart"];
        var loaded = false;
        function loadGA() {
          if (loaded) return;
          if (!hostIsMeasured()) return;
          // Checked here rather than at registration, and deliberately WITHOUT
          // setting `loaded` or removing the listeners: this is a SPA, so a
          // visitor can navigate from a report to an ordinary page in the same
          // document. Bailing without latching lets analytics start there.
          if (urlIsSecret()) return;
          loaded = true;
          events.forEach(function (e) {
            window.removeEventListener(e, loadGA);
          });
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
          document.head.appendChild(s);
          gtag("js", new Date());
          gtag("config", GA_ID, {
            anonymize_ip: true,
            cookie_flags: "SameSite=Lax;Secure",
          });
        }
        events.forEach(function (e) {
          window.addEventListener(e, loadGA, { passive: true });
        });
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="background-color: #fff; display: contents">%sveltekit.body%</div>
  </body>
</html>

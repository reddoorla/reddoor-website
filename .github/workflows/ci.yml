name: ci
on:
  pull_request:
  push:
    # staging is here because work reaches it by DIRECT PUSH, not always by PR.
    # `pull_request:` covers anything opened against any branch, but a
    # fast-forward straight onto staging opened no PR and so ran nothing — a
    # spec added on a feature branch could sit unverified until its eventual PR
    # to main. That is how a timezone-dependent assertion in
    # inquiry-modal.spec.ts survived to #133: it had never once executed in CI,
    # passed on every Pacific machine, and failed on the UTC runner the first
    # time CI ever saw it.
    branches: [main, staging]
jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: reddoorla/.github/.github/workflows/ci.yml@c714d9e472885bbf66f386e9f056a16aab7986d2 # v1.4.2
    with:
      node-version: "24"
      netlify-site: "reddoorla"

  The design rotates the source glyph 90° clockwise so the arrow points right.
  That rotation is already baked into these coordinates (Figma exports the node
  as rendered), so do NOT rotate this file again in CSS — a wrapper rotation
  would also rotate the axis of the hover nudge.
-->

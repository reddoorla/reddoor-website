# Hourly check for Prismic videos that have not reached R2 an hour after they
# were published. It opens (or updates) the `video-pipeline` issue listing them,
# and goes red while any are stuck. The encode workflow runs the same check
# after each encode; this one catches the videos whose dispatch never arrived.
name: video-pipeline-stuck

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: video-pipeline-stuck
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  stuck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find videos stuck on Prismic
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: pnpm exec reddoor-maint video-pipeline stuck --site reddoor-website --repo "$REPO" --prismic reddoor-la --media-base https://media.reddoorla.com --rules src/lib/video/pipeline-rules.json --open-issue

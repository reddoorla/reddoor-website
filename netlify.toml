[build]
    command = "pnpm build"
    publish = "build/"

[build.environment]
    NODE_VERSION = "24"
    COREPACK_INTEGRITY_KEYS = "0"

# Baseline security headers, applied to every response on the deployed site.
#
# Notes on what is deliberately NOT restricted, so nothing breaks:
#   - Permissions-Policy lists only features the site never uses; autoplay and
#     fullscreen are left untouched so the Vimeo background embeds keep working.
#   - X-Frame-Options is SAMEORIGIN. The Slice Machine simulator frames the
#     LOCAL dev server (localSliceSimulatorURL = localhost:5173), not this
#     deployed origin, and the Prismic preview toolbar injects a script rather
#     than framing — so neither is affected. If the slice simulator is ever
#     pointed at a deployed URL, /slice-simulator will need a frame-ancestors
#     carve-out (CSP) instead.
#
# Content-Security-Policy is ENFORCING (promoted from Report-Only 2026-07-16
# after a crawl with securitypolicyviolation listeners recorded zero violations
# on every header-carrying route — home/about/portfolio incl. filter+search,
# three detail pages incl. live Vimeo iframes, twenty-for-twenty, mobile menu).
# If a legitimate new source ever gets blocked, the quick rollback is renaming
# this header back to `Content-Security-Policy-Report-Only`.
#
# connect-src carries Google's documented GA4 set (*.analytics.google.com for
# region-routed beacons, *.g.doubleclick.net / *.google.com for the observed
# /g/collect fallback) — a crawl from one region only exercises one routing,
# so the allowlist follows the docs, not just the observation.
#
# backend.leadconnectorhq.com was REMOVED 2026-08-19. It was there for the
# inquiry modal's browser-side fire at the GHL widget endpoint — an endpoint
# that turned out to be structurally unusable (it needs a cf_clearance cookie
# from a Cloudflare zone we do not own; see src/lib/ghl/constants.ts) and was
# replaced by the server-side v2 sync. Nothing in the browser has spoken to the
# CRM since. A connect-src entry for a host we never call is a standing
# permission with no purpose, and the smoke suites now assert the opposite:
# every one of them fails the run if the browser touches leadconnectorhq.com.
#
# Known gap: Netlify only attaches [[headers]] to statically-served files.
# SSR/function responses ship with NO custom headers at all — that includes
# the 404 page AND /contact (prerender=false for its form action), so the
# site's only form + Turnstile page is neither validated nor protected by
# this policy. Predates this change; fix is setting headers in
# hooks.server.ts, and those routes should re-run Report-Only first.
#
# The allowlist directives are tight; script-src/style-src keep 'unsafe-inline'
# because SvelteKit emits an inline hydration script and the app uses inline
# style attributes + Svelte transitions throughout. Dropping script 'unsafe-
# inline' later means adopting SvelteKit's built-in CSP (kit.csp hash/nonce mode)
# AND hashing the GA bootstrap in app.html — out of scope for this report-only pass.
#
# style-src MUST include p.typekit.net: the kit CSS (use.typekit.net/<kit>.css)
# `@import`s p.typekit.net/p.css, which the browser fetches as a STYLESHEET
# (style-src), not a font (font-src). Report-Only only warned; enforcing blocked
# it → the whole pragmatica family fell back to system sans-serif in prod. This
# @import fires before any securitypolicyviolation listener can attach, which is
# why the promotion crawl missed it — verified live via render-level font probe.
# frame-src includes app.netlify.com only for the deploy-preview banner Netlify
# injects into deploy-preview-*.netlify.app (never production); without it the
# banner's frame trips errors-in-console and tanks the Lighthouse BP gate on
# every preview. Harmless in prod (prod never frames it).
[[headers]]
    for = "/*"

    [headers.values]
        X-Frame-Options = "SAMEORIGIN"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Strict-Transport-Security = "max-age=31536000; includeSubDomains"
        Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
        Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://static.cdn.prismic.io https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://use.typekit.net https://p.typekit.net https://fonts.googleapis.com; font-src 'self' data: https://use.typekit.net https://p.typekit.net https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://player.vimeo.com https://*.prismic.io https://challenges.cloudflare.com https://app.netlify.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.prismic.io https://*.typekit.net"

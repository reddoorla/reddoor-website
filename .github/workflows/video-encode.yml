# Encodes a Prismic video master to R2 (media.reddoorla.com), then rebuilds the
# site so its slices play the R2 files. The relay (src/lib/server/video-relay.ts,
# run by netlify/functions/prismic-video.mts) calls the workflow-dispatch API
# when an editor publishes a video; a manual run starts it from the Actions tab.
# The shared library is @reddoorla/maintenance/video-pipeline.
name: video-encode

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Prismic file URL of the master"
        required: true
        type: string
      class:
        description: "background or player"
        required: true
        type: choice
        options: [background, player]
      key:
        description: "R2 key from the relay; leave empty for a manual run"
        required: false
        type: string
        default: ""

# Every run of one video shares a group, whatever started it.
concurrency:
  group: video-encode-${{ inputs.url }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Encode and upload to R2
        id: encode
        # bash here runs `bash --noprofile --norc -eo pipefail`, so an encode
        # failure fails the step even though its output goes through tee.
        shell: bash
        env:
          URL: ${{ inputs.url }}
          CLASS: ${{ inputs.class }}
          # Set only on a dispatch from the relay; encode refuses a key that its own --site would not give.
          KEY: ${{ inputs.key }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: |
          log="$(mktemp)"
          pnpm exec reddoor-maint video-pipeline encode --url "$URL" --class "$CLASS" --site reddoor-website ${KEY:+--key "$KEY"} | tee "$log"
          # encode prints `SKIP <key>: ...` when the R2 copy already serves this class; nothing changed, so no rebuild.
          if grep -q '^SKIP ' "$log"; then echo "rebuild=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rebuild the site
        if: steps.encode.outputs.rebuild != 'false'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          : "${NETLIFY_BUILD_HOOK:?NETLIFY_BUILD_HOOK is not set}"
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK" > /dev/null && echo "build hook called"

      - name: Stuck check
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: pnpm exec reddoor-maint video-pipeline stuck --site reddoor-website --repo "$REPO" --prismic reddoor-la --media-base https://media.reddoorla.com --rules src/lib/video/pipeline-rules.json --open-issue || true

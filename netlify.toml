[build]
    command = "pnpm build"
    publish = "build/"
    functions = "functions/"

[build.environment]
    NODE_VERSION = "24"
    COREPACK_INTEGRITY_KEYS = "0"

# Baseline security headers, applied to every response on the deployed site.
#
# Notes on what is deliberately NOT restricted, so nothing breaks:
#   - Permissions-Policy lists only features the site never uses; autoplay and
#     fullscreen are left untouched so the Vimeo background embeds keep working.
#   - X-Frame-Options is SAMEORIGIN. The Slice Machine simulator frames the
#     LOCAL dev server (localSliceSimulatorURL = localhost:5173), not this
#     deployed origin, and the Prismic preview toolbar injects a script rather
#     than framing — so neither is affected. If the slice simulator is ever
#     pointed at a deployed URL, /slice-simulator will need a frame-ancestors
#     carve-out (CSP) instead.
#
# Content-Security-Policy is ENFORCING (promoted from Report-Only 2026-07-16
# after a full-site crawl with securitypolicyviolation listeners on every route
# — home/about/portfolio incl. filter+search, three detail pages incl. live
# Vimeo iframes, twenty-for-twenty, contact incl. Turnstile, 404, mobile menu —
# recorded zero violations). If a legitimate new source ever gets blocked, the
# quick rollback is renaming this header back to
# `Content-Security-Policy-Report-Only`.
#
# Known gap: Netlify only attaches these headers to statically-served files;
# SSR/function responses (e.g. the 404 page) currently ship with NO custom
# headers at all. That predates this change and is tracked separately.
#
# The allowlist directives are tight; script-src/style-src keep 'unsafe-inline'
# because SvelteKit emits an inline hydration script and the app uses inline
# style attributes + Svelte transitions throughout. Dropping script 'unsafe-
# inline' later means adopting SvelteKit's built-in CSP (kit.csp hash/nonce mode)
# AND hashing the GA bootstrap in app.html — out of scope for this report-only pass.
[[headers]]
    for = "/*"

    [headers.values]
        X-Frame-Options = "SAMEORIGIN"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Strict-Transport-Security = "max-age=31536000; includeSubDomains"
        Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
        Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://static.cdn.prismic.io https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://use.typekit.net https://fonts.googleapis.com; font-src 'self' data: https://use.typekit.net https://p.typekit.net https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://player.vimeo.com https://*.prismic.io https://challenges.cloudflare.com; connect-src 'self' https://*.google-analytics.com https://www.googletagmanager.com https://*.prismic.io https://*.typekit.net"
